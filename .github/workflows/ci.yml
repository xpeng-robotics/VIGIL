name: Offline checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: offline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.10'
          - os: macos-latest
            python: '3.12'
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install test dependencies
        run: python -m pip install -e '.[dev]' wheel
      - name: Run the offline suite
        run: python -m pytest -p no:cacheprovider
      - name: Validate tasks and recorded evidence
        run: |
          python -m vigil validate-pack
          python -m vigil verify-run vigil/web/demo --require-frames
      - name: Check the public source export
        run: |
          python scripts/release/export_public_release.py "$RUNNER_TEMP/vigil-public"
          python scripts/release/check_public_release.py "$RUNNER_TEMP/vigil-public"
